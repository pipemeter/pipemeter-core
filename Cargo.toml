[package]
name = "pipemeter-core"
version = "0.1.0"
edition = "2024"
authors = ["PipeMeeter Team <dev@pipemeeter.org>"]
description = "Core PipeWire audio routing, node and port management, and meter processing for PipeMeeter"
license = "Unlicense"
repository = "https://github.com/pipemeter/pipemeter-core"

[lib]
name = "pipemeter_core"
path = "src/lib.rs"

[dependencies]
log = "0.4"
pipewire = { version = "0.10", features = ["v0_3_44"] }
# `wav` and `aiff` are container readers; `pcm` is the codec inside them,
# and it is a separate feature. Without it the deck refused every WAV with
# "unsupported codec" - including takes its own recorder had just written.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "aiff", "pcm", "adpcm", "vorbis", "aac", "isomp4", "alac"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"
